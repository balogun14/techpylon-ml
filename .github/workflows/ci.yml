name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy extractor bench
      - run: uv run pytest -q
      # the bench is the regression gate: extraction changes must hold 0.9
      - run: uv run python -m bench.harness
